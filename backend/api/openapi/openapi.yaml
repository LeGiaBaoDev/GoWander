openapi: 3.1.0
info:
  title: GoWander API
  version: 0.5.0
  description: |
    Hợp đồng API của backend GoWander (M04). App chỉ phụ thuộc vào file này, không phụ thuộc OpenTripPlanner.
    Quyết định: docs/decisions/ADR-027-go-routing-api.md.
paths:
  /api/v1/routes/plan:
    post:
      operationId: planRoute
      summary: Tìm tuyến giữa hai điểm
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanRequest' }
            example:
              origin: { lat: 10.770775, lon: 106.697569 }
              destination: { lat: 10.879569, lon: 106.81417 }
              dateTime: '2026-11-17T09:00:00+07:00'
              timeType: DEPART
      responses:
        '200':
          description: Có ít nhất một hành trình
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
        '504': { $ref: '#/components/responses/Error' }
  /api/v1/place-categories:
    get:
      operationId: listPlaceCategories
      summary: Danh mục địa điểm đang hoạt động, kèm số địa điểm đã xuất bản
      responses:
        '200':
          description: Danh mục
          content:
            application/json:
              schema:
                type: object
                required: [categories]
                properties:
                  categories:
                    type: array
                    items: { $ref: '#/components/schemas/Category' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/places:
    get:
      operationId: listPlaces
      summary: Danh sách địa điểm đã xuất bản, sắp theo tên, phân trang bằng cursor
      parameters:
        - { name: category, in: query, schema: { type: string, maxLength: 100 }, description: 'slug danh mục, ví dụ museum' }
        - { name: q, in: query, schema: { type: string, minLength: 2, maxLength: 100 }, description: 'Tìm theo tên VI/EN, không phân biệt dấu' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: cursor, in: query, schema: { type: string }, description: 'nextCursor của trang trước' }
      responses:
        '200':
          description: Một trang địa điểm
          content:
            application/json:
              schema:
                type: object
                required: [places]
                properties:
                  places:
                    type: array
                    items: { $ref: '#/components/schemas/PlaceSummary' }
                  nextCursor: { type: string, description: 'Không có = trang cuối' }
        '400': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/places/nearby:
    get:
      operationId: nearbyPlaces
      summary: Địa điểm đã xuất bản trong bán kính, gần nhất trước
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lon, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: radiusM, in: query, schema: { type: integer, minimum: 1, maximum: 5000, default: 1000 } }
        - { name: category, in: query, schema: { type: string, maxLength: 100 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: Địa điểm, có distanceM
          content:
            application/json:
              schema:
                type: object
                required: [places]
                properties:
                  places:
                    type: array
                    items: { $ref: '#/components/schemas/PlaceSummary' }
        '400': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/places/map:
    get:
      operationId: placesInBounds
      summary: Địa điểm đã xuất bản trong khung bản đồ; khung dày thì trả một mẫu rải đều và ổn định
      parameters:
        - { name: south, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: west, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: north, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 }, description: Lớn hơn south }
        - { name: east, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 }, description: Lớn hơn west }
        - { name: categories, in: query, schema: { type: string }, description: 'Tối đa 10 slug cách nhau bằng dấu phẩy; địa điểm thuộc bất kỳ slug nào' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Địa điểm, không có distanceM
          content:
            application/json:
              schema:
                type: object
                required: [places]
                properties:
                  places:
                    type: array
                    items: { $ref: '#/components/schemas/PlaceSummary' }
        '400': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/places/map/clusters:
    get:
      operationId: placeClusters
      summary: Số địa điểm đã xuất bản theo từng ô lưới của khung bản đồ (dùng khi bản đồ zoom xa)
      parameters:
        - { name: south, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: west, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: north, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 }, description: Lớn hơn south }
        - { name: east, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 }, description: Lớn hơn west }
        - { name: categories, in: query, schema: { type: string }, description: 'Tối đa 10 slug cách nhau bằng dấu phẩy' }
        - { name: cols, in: query, schema: { type: integer, minimum: 1, maximum: 12, default: 4 } }
        - { name: rows, in: query, schema: { type: integer, minimum: 1, maximum: 12, default: 6 } }
      responses:
        '200':
          description: Mỗi ô có địa điểm là một cụm; lat/lon là chỗ vẽ cụm (tâm các địa điểm, giữ trong nửa giữa của ô)
          content:
            application/json:
              schema:
                type: object
                required: [clusters]
                properties:
                  clusters:
                    type: array
                    items:
                      type: object
                      required: [lat, lon, count]
                      properties:
                        lat: { type: number }
                        lon: { type: number }
                        count: { type: integer, minimum: 1 }
        '400': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/places/{id}:
    get:
      operationId: getPlace
      summary: Chi tiết một địa điểm đã xuất bản
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Chi tiết
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaceDetail' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/geocode:
    get:
      operationId: geocode
      summary: Tìm địa chỉ hoặc địa danh (Photon tự chạy, dữ liệu OSM). Không ảnh hưởng readiness.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 200 } }
        - { name: lat, in: query, schema: { type: number, minimum: -90, maximum: 90 }, description: 'Ưu tiên kết quả gần điểm này (cần cả lon)' }
        - { name: lon, in: query, schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 10, default: 5 } }
      responses:
        '200':
          description: Kết quả, kèm nguồn phải hiển thị
          content:
            application/json:
              schema:
                type: object
                required: [results, source]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required: [name, lat, lon]
                      properties:
                        name: { type: string }
                        detail: { type: string }
                        lat: { type: number }
                        lon: { type: number }
                        ref: { type: string, description: 'Đối tượng OSM, ví dụ way/123' }
                        approximate: { type: boolean, description: 'Người dùng gõ số nhà nhưng kết quả không có số nhà' }
                  source:
                    type: object
                    properties:
                      provider: { type: string }
                      attribution: { type: string }
                      license: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/geocode/reverse:
    get:
      operationId: reverseGeocode
      summary: Địa chỉ/địa danh tại một điểm (gợi ý khi chọn trên bản đồ, M4). Cùng dạng response với /api/v1/geocode.
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lon, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
      responses:
        '200': { description: 'Tối đa 3 kết quả, kèm source' }
        '400': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/street-images/nearest:
    get:
      operationId: nearestStreetImage
      summary: Ảnh đường phố gần một điểm (Mapillary, CC BY-SA 4.0) cho màn "Xem trước tuyến đường" (NAV-1, ADR-033).
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lon, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
      responses:
        '200':
          description: 'Ảnh gần nhất trong khoảng 60 m, kèm source (provider, license, attribution) phải hiện cùng ảnh'
          content:
            application/json:
              schema:
                type: object
                required: [image, source]
                properties:
                  image:
                    type: object
                    required: [id, url, capturedAt, lat, lon, pageUrl]
                    properties:
                      id: { type: string }
                      url: { type: string, format: uri }
                      capturedAt: { type: string, format: date-time }
                      lat: { type: number }
                      lon: { type: number }
                      creator: { type: string }
                      pageUrl: { type: string, format: uri }
                  source:
                    type: object
                    required: [provider, license, attribution]
                    properties: { provider: { type: string }, license: { type: string }, attribution: { type: string } }
        '400': { $ref: '#/components/responses/Error' }
        '429': { description: 'RATE_LIMITED (quá 30 lần/phút mỗi IP)', $ref: '#/components/responses/Error' }
        '404': { description: 'STREET_IMAGE_NOT_FOUND', $ref: '#/components/responses/Error' }
        '503': { description: 'STREET_IMAGERY_UNAVAILABLE (chưa cấu hình MAPILLARY_TOKEN hoặc Mapillary lỗi)', $ref: '#/components/responses/Error' }
  /health/live:
    get:
      operationId: live
      summary: Process còn chạy
      responses:
        '200': { $ref: '#/components/responses/Health' }
  /health/ready:
    get:
      operationId: ready
      summary: Sẵn sàng phục vụ (OTP và database trả lời trong 1 giây)
      responses:
        '200': { $ref: '#/components/responses/Health' }
        '503': { $ref: '#/components/responses/Health' }
components:
  headers:
    RequestId:
      description: Mã request, cũng có trong log và trong body lỗi
      schema: { type: string }
  responses:
    Error:
      description: |
        400 INVALID_REQUEST; 422 NO_ROUTE_FOUND, OUT_OF_COVERAGE, DATA_UNAVAILABLE;
        503 ROUTING_UNAVAILABLE; 504 ROUTING_TIMEOUT. Mọi endpoint còn có thể trả
        404/405 NOT_FOUND (sai đường dẫn hoặc phương thức) và 500 INTERNAL_ERROR (lỗi không lường trước).
        Discover: 404 PLACE_NOT_FOUND; 503 DATA_STORE_UNAVAILABLE (database lỗi hoặc quá 5 giây).
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Health:
      description: Trạng thái
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties:
              status: { type: string, enum: [ok, unavailable] }
  schemas:
    Coordinate:
      type: object
      required: [lat, lon]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lon: { type: number, minimum: -180, maximum: 180 }
    PlanRequest:
      type: object
      additionalProperties: false
      required: [origin, destination]
      properties:
        origin: { $ref: '#/components/schemas/Coordinate' }
        destination: { $ref: '#/components/schemas/Coordinate' }
        dateTime:
          type: string
          format: date-time
          description: RFC 3339, bắt buộc có múi giờ. Bỏ trống = bây giờ.
        timeType:
          type: string
          enum: [DEPART, ARRIVE]
          default: DEPART
          description: DEPART = đi sau dateTime; ARRIVE = đến trước dateTime.
        modes:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [WALK, TRANSIT, BUS, CAR, BICYCLE] }
          default: [WALK, TRANSIT]
          description: >-
            [WALK] = chỉ đi bộ; [TRANSIT] = bắt buộc dùng phương tiện công cộng (Metro, xe buýt); cả hai = để hệ thống chọn.
            [BUS] = chỉ đi xe buýt (đi bộ tới/từ trạm). [CAR] hoặc [BICYCLE] = chỉ đi bằng ô tô / xe đạp. BUS, CAR, BICYCLE phải đứng một mình (RD-0, ADR-032). Thời gian ô tô không tính kẹt xe.
        maxResults: { type: integer, minimum: 1, maximum: 5, default: 3 }
    PlanResponse:
      type: object
      required: [dataStatus, routes]
      properties:
        dataStatus:
          type: string
          enum: [ASSUMED, OFFICIAL]
          description: ASSUMED = dữ liệu giả định, không phải lịch chính thức (ADR-020).
        routes:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Route' }
    Route:
      type: object
      required: [startTime, endTime, durationSec, walkDistanceM, transfers, legs]
      properties:
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time }
        durationSec: { type: integer }
        walkDistanceM: { type: number }
        transfers: { type: integer }
        legs:
          type: array
          items: { $ref: '#/components/schemas/Leg' }
    Leg:
      type: object
      required: [mode, transit, from, to, startTime, endTime, durationSec, distanceM, realtime, polyline]
      properties:
        mode: { type: string, description: 'Ví dụ WALK, SUBWAY, BUS, CAR, BICYCLE' }
        transit: { type: boolean }
        from: { $ref: '#/components/schemas/Place' }
        to: { $ref: '#/components/schemas/Place' }
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time }
        durationSec: { type: integer }
        distanceM: { type: number }
        realtime: { type: boolean, description: 'false = giờ theo lịch' }
        headsign: { type: string }
        line:
          type: object
          required: [id]
          properties:
            id: { type: string }
            shortName: { type: string }
            longName: { type: string }
        polyline: { type: string, description: 'Google encoded polyline, độ chính xác 5' }
        steps:
          type: array
          description: 'Chỉ dẫn từng bước (NAV-1) cho chặng đi bộ/xe đạp/ô tô; không có ở chặng công cộng'
          items:
            type: object
            required: [direction, street, distanceM, lat, lon]
            properties:
              direction: { type: string, description: 'relativeDirection của OTP: DEPART, LEFT, RIGHT, SLIGHTLY_LEFT, HARD_RIGHT, CONTINUE, UTURN_LEFT, CIRCLE_CLOCKWISE, ...' }
              street: { type: string, description: 'Tên đường; OTP dùng "road", "path"… khi đường không có tên' }
              distanceM: { type: number, description: 'Quãng đường từ bước này đến bước sau' }
              lat: { type: number }
              lon: { type: number }
    Place:
      type: object
      required: [name, lat, lon]
      properties:
        name: { type: string }
        lat: { type: number }
        lon: { type: number }
        stopId: { type: string, description: 'Chỉ có khi là ga/trạm' }
    Category:
      type: object
      required: [slug, name, placeCount]
      properties:
        slug: { type: string }
        name: { type: string }
        nameEn: { type: string }
        placeCount: { type: integer }
    CategoryRef:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string }
        name: { type: string }
        nameEn: { type: string }
    Source:
      type: object
      required: [kind, license, attribution]
      description: Nguồn và giấy phép, phải hiển thị cho người dùng (ADR-028)
      properties:
        kind: { type: string, enum: [OSM, CURATED] }
        url: { type: string }
        license: { type: string }
        attribution: { type: string }
    PlaceSummary:
      type: object
      required: [id, name, slug, lat, lon, source]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        nameEn: { type: string }
        slug: { type: string }
        shortDescription: { type: string }
        lat: { type: number }
        lon: { type: number }
        address: { type: string }
        category: { $ref: '#/components/schemas/CategoryRef' }
        distanceM: { type: number, description: 'Chỉ có ở /places/nearby' }
        source: { $ref: '#/components/schemas/Source' }
    PlaceDetail:
      allOf:
        - { $ref: '#/components/schemas/PlaceSummary' }
        - type: object
          required: [categories, media, foods]
          properties:
            categories:
              type: array
              items: { $ref: '#/components/schemas/CategoryRef' }
            media:
              type: array
              items:
                type: object
                required: [storageKey, mediaType, sourceCredit, license, isCover]
                properties:
                  storageKey: { type: string }
                  mediaType: { type: string }
                  altText: { type: string }
                  sourceCredit: { type: string }
                  license: { type: string }
                  isCover: { type: boolean }
            foods:
              type: array
              items:
                type: object
                required: [name, slug, currency]
                properties:
                  name: { type: string }
                  nameEn: { type: string }
                  slug: { type: string }
                  priceMin: { type: number }
                  priceMax: { type: number }
                  currency: { type: string }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
              enum: [INVALID_REQUEST, NO_ROUTE_FOUND, OUT_OF_COVERAGE, DATA_UNAVAILABLE, ROUTING_TIMEOUT, ROUTING_UNAVAILABLE, NOT_FOUND, INTERNAL_ERROR, PLACE_NOT_FOUND, DATA_STORE_UNAVAILABLE, GEOCODER_UNAVAILABLE]
            message: { type: string, description: 'Tiếng Việt, hiển thị được cho người dùng' }
            requestId: { type: string }
