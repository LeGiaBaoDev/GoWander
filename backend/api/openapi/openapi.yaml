openapi: 3.1.0
info:
  title: GoWander API
  version: 0.6.0
  description: |
    Hợp đồng API của backend GoWander (M04). App chỉ phụ thuộc vào file này, không phụ thuộc OpenTripPlanner.
    Quyết định: docs/decisions/ADR-027-go-routing-api.md.
paths:
  /api/v1/routes/plan:
    post:
      operationId: planRoute
      summary: Tìm tuyến giữa hai điểm
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanRequest' }
            example:
              origin: { lat: 10.770775, lon: 106.697569 }
              destination: { lat: 10.879569, lon: 106.81417 }
              dateTime: '2026-11-17T09:00:00+07:00'
              timeType: DEPART
      responses:
        '200':
          description: Có ít nhất một hành trình
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
        '504': { $ref: '#/components/responses/Error' }
  /api/v1/place-categories:
    get:
      operationId: listPlaceCategories
      summary: Danh mục địa điểm đang hoạt động, kèm số địa điểm đã xuất bản
      responses:
        '200':
          description: Danh mục
          content:
            application/json:
              schema:
                type: object
                required: [categories]
                properties:
                  categories:
                    type: array
                    items: { $ref: '#/components/schemas/Category' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/places:
    get:
      operationId: listPlaces
      summary: Danh sách địa điểm đã xuất bản, sắp theo tên, phân trang bằng cursor
      parameters:
        - { name: category, in: query, schema: { type: string, maxLength: 100 }, description: 'slug danh mục, ví dụ museum' }
        - { name: q, in: query, schema: { type: string, minLength: 2, maxLength: 100 }, description: 'Tìm theo tên VI/EN, không phân biệt dấu' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: cursor, in: query, schema: { type: string }, description: 'nextCursor của trang trước' }
      responses:
        '200':
          description: Một trang địa điểm
          content:
            application/json:
              schema:
                type: object
                required: [places]
                properties:
                  places:
                    type: array
                    items: { $ref: '#/components/schemas/PlaceSummary' }
                  nextCursor: { type: string, description: 'Không có = trang cuối' }
        '400': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/places/nearby:
    get:
      operationId: nearbyPlaces
      summary: Địa điểm đã xuất bản trong bán kính, gần nhất trước
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lon, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: radiusM, in: query, schema: { type: integer, minimum: 1, maximum: 5000, default: 1000 } }
        - { name: category, in: query, schema: { type: string, maxLength: 100 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: Địa điểm, có distanceM
          content:
            application/json:
              schema:
                type: object
                required: [places]
                properties:
                  places:
                    type: array
                    items: { $ref: '#/components/schemas/PlaceSummary' }
        '400': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/feedbacks:
    post:
      operationId: submitFeedback
      summary: Gửi feedback từ app (khách được gửi; tên, email, ảnh không bắt buộc)
      description: >-
        Chỉ ghi, không có API công khai để đọc lại. Ảnh JPEG/PNG ≤ 5 MB được mã hoá lại (bỏ EXIF/GPS) và lưu riêng tư,
        chỉ Admin (quản trị hệ thống, kiểm duyệt) xem được. Mỗi địa chỉ IP tối đa 5 feedback mỗi giờ.
        Gửi kèm `Authorization: Bearer` của một tài khoản đã xác minh email thì server bỏ qua senderName/senderEmail
        và dùng tên + email của tài khoản (ADR-040).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [kind, message]
              properties:
                kind: { type: string, enum: [INFORMATION, BUG, SUGGESTION, OTHER] }
                message: { type: string, minLength: 1, maxLength: 1000 }
                context: { type: string, maxLength: 200, description: 'Màn hình liên quan, ví dụ "Địa điểm · Chợ Bến Thành"; không có vị trí' }
                senderName: { type: string, maxLength: 100 }
                senderEmail: { type: string, format: email, maxLength: 254 }
                image: { type: string, format: binary }
      responses:
        '201':
          description: Đã nhận
          content:
            application/json:
              schema: { type: object, required: [id], properties: { id: { type: string, format: uuid } } }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/places/popular:
    get:
      operationId: popularPlaces
      summary: Địa điểm đang được tìm nhiều (Khám phá); chỉ có hạng, không có số lượt
      description: >-
        Top 10 địa điểm đã xuất bản theo số lượt tìm đường kết thúc gần đó (≤ 30 m) trong 7 ngày gần nhất (giờ TP.HCM);
        địa điểm dưới 5 lượt không vào danh sách (ADR-038). Danh sách rỗng khi chưa đủ dữ liệu: app ẩn hàng này.
      responses:
        '200':
          description: Địa điểm theo hạng
          content:
            application/json:
              schema:
                type: object
                required: [days, places]
                properties:
                  days: { type: integer, example: 7 }
                  places:
                    type: array
                    maxItems: 10
                    items:
                      allOf:
                        - $ref: '#/components/schemas/PlaceSummary'
                        - type: object
                          required: [rank]
                          properties:
                            rank: { type: integer, minimum: 1 }
                            thumbUrl: { type: string, format: uri, description: 'Ảnh bìa 480 px, nếu có' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/places/map:
    get:
      operationId: placesInBounds
      summary: Địa điểm đã xuất bản trong khung bản đồ; khung dày thì trả một mẫu rải đều và ổn định
      parameters:
        - { name: south, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: west, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: north, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 }, description: Lớn hơn south }
        - { name: east, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 }, description: Lớn hơn west }
        - { name: categories, in: query, schema: { type: string }, description: 'Tối đa 10 slug cách nhau bằng dấu phẩy; địa điểm thuộc bất kỳ slug nào' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Địa điểm, không có distanceM
          content:
            application/json:
              schema:
                type: object
                required: [places]
                properties:
                  places:
                    type: array
                    items: { $ref: '#/components/schemas/PlaceSummary' }
        '400': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/places/map/clusters:
    get:
      operationId: placeClusters
      summary: Số địa điểm đã xuất bản theo từng ô lưới của khung bản đồ (dùng khi bản đồ zoom xa)
      parameters:
        - { name: south, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: west, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: north, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 }, description: Lớn hơn south }
        - { name: east, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 }, description: Lớn hơn west }
        - { name: categories, in: query, schema: { type: string }, description: 'Tối đa 10 slug cách nhau bằng dấu phẩy' }
        - { name: cols, in: query, schema: { type: integer, minimum: 1, maximum: 12, default: 4 } }
        - { name: rows, in: query, schema: { type: integer, minimum: 1, maximum: 12, default: 6 } }
      responses:
        '200':
          description: Mỗi ô có địa điểm là một cụm; lat/lon là chỗ vẽ cụm (tâm các địa điểm, giữ trong nửa giữa của ô)
          content:
            application/json:
              schema:
                type: object
                required: [clusters]
                properties:
                  clusters:
                    type: array
                    items:
                      type: object
                      required: [lat, lon, count]
                      properties:
                        lat: { type: number }
                        lon: { type: number }
                        count: { type: integer, minimum: 1 }
        '400': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/places/{id}:
    get:
      operationId: getPlace
      summary: Chi tiết một địa điểm đã xuất bản
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Chi tiết
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaceDetail' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/geocode:
    get:
      operationId: geocode
      summary: Tìm địa chỉ hoặc địa danh (Photon tự chạy, dữ liệu OSM). Không ảnh hưởng readiness.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 200 } }
        - { name: lat, in: query, schema: { type: number, minimum: -90, maximum: 90 }, description: 'Ưu tiên kết quả gần điểm này (cần cả lon)' }
        - { name: lon, in: query, schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 10, default: 5 } }
      responses:
        '200':
          description: Kết quả, kèm nguồn phải hiển thị
          content:
            application/json:
              schema:
                type: object
                required: [results, source]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required: [name, lat, lon]
                      properties:
                        name: { type: string }
                        detail: { type: string }
                        lat: { type: number }
                        lon: { type: number }
                        ref: { type: string, description: 'Đối tượng OSM, ví dụ way/123' }
                        approximate: { type: boolean, description: 'Người dùng gõ số nhà nhưng kết quả không có số nhà' }
                  source:
                    type: object
                    properties:
                      provider: { type: string }
                      attribution: { type: string }
                      license: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/geocode/reverse:
    get:
      operationId: reverseGeocode
      summary: Địa chỉ/địa danh tại một điểm (gợi ý khi chọn trên bản đồ, M4). Cùng dạng response với /api/v1/geocode.
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lon, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
      responses:
        '200': { description: 'Tối đa 3 kết quả, kèm source' }
        '400': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/street-images/nearest:
    get:
      operationId: nearestStreetImage
      summary: Ảnh đường phố gần một điểm (Mapillary, CC BY-SA 4.0) cho màn "Xem trước tuyến đường" (NAV-1, ADR-033).
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lon, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
      responses:
        '200':
          description: 'Ảnh gần nhất trong khoảng 60 m, kèm source (provider, license, attribution) phải hiện cùng ảnh'
          content:
            application/json:
              schema:
                type: object
                required: [image, source]
                properties:
                  image:
                    type: object
                    required: [id, url, capturedAt, lat, lon, pageUrl]
                    properties:
                      id: { type: string }
                      url: { type: string, format: uri }
                      capturedAt: { type: string, format: date-time }
                      lat: { type: number }
                      lon: { type: number }
                      creator: { type: string }
                      pageUrl: { type: string, format: uri }
                  source:
                    type: object
                    required: [provider, license, attribution]
                    properties: { provider: { type: string }, license: { type: string }, attribution: { type: string } }
        '400': { $ref: '#/components/responses/Error' }
        '429': { description: 'RATE_LIMITED (quá 30 lần/phút mỗi IP)', $ref: '#/components/responses/Error' }
        '404': { description: 'STREET_IMAGE_NOT_FOUND', $ref: '#/components/responses/Error' }
        '503': { description: 'STREET_IMAGERY_UNAVAILABLE (chưa cấu hình MAPILLARY_TOKEN hoặc Mapillary lỗi)', $ref: '#/components/responses/Error' }
  /api/v1/auth/register:
    post:
      operationId: registerAppAccount
      summary: Tạo tài khoản app (tên đăng nhập + email + số điện thoại không bắt buộc + mật khẩu)
      description: >-
        Tài khoản app tách khỏi tài khoản Admin (ADR-040). Trả về phiên ngay và gửi mã 6 số tới email để xác minh.
        `codeSent=false` nghĩa là tài khoản đã tạo nhưng thư chưa gửi được: app mời bấm "Gửi lại mã".
        Email, số điện thoại hoặc tên đăng nhập đã dùng → 409 ACCOUNT_EXISTS (câu trả lời không nói cái nào trùng).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, username, email, password]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                username:
                  type: string
                  pattern: '^[a-z][a-z0-9._]{2,29}$'
                  description: 3–30 ký tự, bắt đầu bằng chữ, không phân biệt hoa thường (lưu chữ thường)
                email: { type: string, format: email, maxLength: 254 }
                phone: { type: string, maxLength: 20, description: 'E.164 hoặc số Việt Nam bắt đầu bằng 0' }
                password: { type: string, minLength: 8, maxLength: 128 }
                device: { type: string, maxLength: 100, description: 'Nhãn thiết bị, ví dụ iPhone' }
      responses:
        '201':
          description: Đã tạo tài khoản và phiên
          content:
            application/json:
              schema:
                type: object
                required: [session, user, codeSent]
                properties:
                  session: { $ref: '#/components/schemas/AppSession' }
                  user: { $ref: '#/components/schemas/AppUser' }
                  codeSent: { type: boolean, description: 'false = chưa gửi được mã, mời gửi lại' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { description: 'ACCOUNT_EXISTS', $ref: '#/components/responses/Error' }
        '429': { description: 'RATE_LIMITED', $ref: '#/components/responses/Error' }
        '503': { description: 'EMAIL_UNAVAILABLE', $ref: '#/components/responses/Error' }
  /api/v1/auth/login:
    post:
      operationId: loginAppAccount
      summary: Đăng nhập bằng email, số điện thoại hoặc tên đăng nhập + mật khẩu
      description: >-
        Một ô nhận cả ba kiểu. Sai 5 lần → khoá 15 phút (423 ACCOUNT_LOCKED, có giờ mở lại). Số điện thoại chỉ dùng
        đăng nhập khi email của tài khoản đã xác minh (chưa có SMS nên số chưa xác minh được).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier: { type: string, description: 'email, số điện thoại hoặc tên đăng nhập' }
                password: { type: string }
                device: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Đã đăng nhập
          content:
            application/json:
              schema:
                type: object
                required: [session, user]
                properties:
                  session: { $ref: '#/components/schemas/AppSession' }
                  user: { $ref: '#/components/schemas/AppUser' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { description: 'LOGIN_FAILED (một câu trả lời cho mọi lý do)', $ref: '#/components/responses/Error' }
        '423': { description: 'ACCOUNT_LOCKED', $ref: '#/components/responses/Error' }
        '429': { description: 'RATE_LIMITED', $ref: '#/components/responses/Error' }
  /api/v1/auth/google:
    post:
      operationId: loginWithGoogle
      summary: Đăng nhập bằng Google ID token lấy trên máy
      description: >-
        Server kiểm chữ ký RS256 với khoá công khai của Google, iss, aud = GOOGLE_CLIENT_ID, exp và
        email_verified. Lần đầu thì tạo tài khoản (email đã xác minh, không mật khẩu). Email Google trùng một tài
        khoản mật khẩu có sẵn → 409 LINK_REQUIRED, không tự gộp.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                idToken: { type: string }
                device: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Đã đăng nhập
          content:
            application/json:
              schema:
                type: object
                required: [session, user, created]
                properties:
                  session: { $ref: '#/components/schemas/AppSession' }
                  user: { $ref: '#/components/schemas/AppUser' }
                  created: { type: boolean, description: 'true = vừa tạo tài khoản' }
        '401': { description: 'GOOGLE_TOKEN_INVALID', $ref: '#/components/responses/Error' }
        '409': { description: 'LINK_REQUIRED', $ref: '#/components/responses/Error' }
        '503': { description: 'GOOGLE_UNAVAILABLE (chưa cấu hình GOOGLE_CLIENT_ID)', $ref: '#/components/responses/Error' }
  /api/v1/auth/verify-email:
    post:
      operationId: verifyAppEmail
      summary: Xác minh email bằng mã 6 số
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [code], properties: { code: { type: string, pattern: '^[0-9]{6}$' } } }
      responses:
        '200':
          description: Đã xác minh
          content:
            application/json:
              schema: { type: object, required: [user], properties: { user: { $ref: '#/components/schemas/AppUser' } } }
        '400': { description: 'CODE_INVALID (sai, hết hạn, đã dùng hoặc hết 5 lần thử)', $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/auth/resend-code:
    post:
      operationId: resendAppCode
      summary: Gửi lại mã (chờ 60 giây, tối đa 5 mã/giờ)
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                purpose: { type: string, enum: [VERIFY_EMAIL, RESET_PASSWORD], default: VERIFY_EMAIL }
      responses:
        '202': { description: Đã gửi }
        '401': { $ref: '#/components/responses/Error' }
        '429': { description: 'RATE_LIMITED', $ref: '#/components/responses/Error' }
        '503': { description: 'EMAIL_UNAVAILABLE', $ref: '#/components/responses/Error' }
  /api/v1/auth/forgot:
    post:
      operationId: forgotAppPassword
      summary: Quên mật khẩu — gửi mã 6 số qua email
      description: >-
        Luôn trả 202, dù email có tài khoản hay không và dù vừa yêu cầu xong: không lộ tài khoản có tồn tại.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email], properties: { email: { type: string, format: email } } }
      responses:
        '202': { description: Đã nhận yêu cầu (câu trả lời không đổi theo kết quả)' }
        '429': { description: 'RATE_LIMITED', $ref: '#/components/responses/Error' }
        '503': { description: 'EMAIL_UNAVAILABLE', $ref: '#/components/responses/Error' }
  /api/v1/auth/reset:
    post:
      operationId: resetAppPassword
      summary: Đặt mật khẩu mới bằng mã trong email
      description: Đặt xong thì mọi phiên của tài khoản bị thu hồi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code, newPassword]
              properties:
                email: { type: string, format: email }
                code: { type: string, pattern: '^[0-9]{6}$' }
                newPassword: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '200':
          description: Đã đổi mật khẩu
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean } } }
        '400': { description: 'CODE_INVALID hoặc INVALID_REQUEST', $ref: '#/components/responses/Error' }
        '429': { description: 'RATE_LIMITED', $ref: '#/components/responses/Error' }
  /api/v1/auth/logout:
    post:
      operationId: logoutAppAccount
      summary: Đăng xuất (thu hồi phiên hiện tại)
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Đã đăng xuất }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/auth/logout-all:
    post:
      operationId: logoutEverywhere
      summary: Đăng xuất mọi thiết bị (giữ máy đang gọi)
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Đã thu hồi các phiên khác }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/auth/username-available:
    get:
      operationId: usernameAvailable
      summary: Tên đăng nhập còn trống?
      parameters:
        - { name: u, in: query, required: true, schema: { type: string, maxLength: 30 } }
      responses:
        '200':
          description: Kết quả (tên sai định dạng trả available=false)
          content:
            application/json:
              schema: { type: object, required: [available], properties: { available: { type: boolean } } }
        '429': { description: 'RATE_LIMITED', $ref: '#/components/responses/Error' }
  /api/v1/me:
    get:
      operationId: getMe
      summary: Tài khoản đang đăng nhập
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Tài khoản
          content:
            application/json:
              schema: { type: object, required: [user], properties: { user: { $ref: '#/components/schemas/AppUser' } } }
        '401': { description: 'AUTH_REQUIRED', $ref: '#/components/responses/Error' }
    patch:
      operationId: updateMe
      summary: Đổi tên hiển thị, tên đăng nhập, số điện thoại
      security: [{ bearerAuth: [] }]
      description: Đổi email là việc của AUTH-6; ở đây không nhận.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                username: { type: string, pattern: '^[a-z][a-z0-9._]{2,29}$' }
                phone: { type: string, description: 'để trống để xoá số' }
      responses:
        '200':
          description: Đã cập nhật
          content:
            application/json:
              schema: { type: object, required: [user], properties: { user: { $ref: '#/components/schemas/AppUser' } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { description: 'ACCOUNT_EXISTS (tên đăng nhập hoặc số đã dùng)', $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteMe
      summary: Xoá tài khoản (xoá ngay tên, email, số, mật khẩu; feedback giữ nội dung, gỡ người gửi)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password: { type: string, description: 'bắt buộc khi tài khoản có mật khẩu' }
                idToken: { type: string, description: 'dùng cho tài khoản chỉ có Google' }
      responses:
        '204': { description: Đã xoá }
        '400': { $ref: '#/components/responses/Error' }
        '401': { description: 'AUTH_REQUIRED hoặc GOOGLE_TOKEN_INVALID', $ref: '#/components/responses/Error' }
  /api/v1/me/password:
    post:
      operationId: changeAppPassword
      summary: Đổi mật khẩu (hoặc đặt mật khẩu đầu tiên cho tài khoản Google)
      security: [{ bearerAuth: [] }]
      description: Đổi xong, các thiết bị khác bị đăng xuất.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new]
              properties:
                current: { type: string, description: 'bỏ trống khi tài khoản chưa có mật khẩu' }
                new: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '204': { description: Đã đổi }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/me/google:
    post:
      operationId: linkGoogle
      summary: Liên kết Google với tài khoản đang đăng nhập
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [idToken], properties: { idToken: { type: string } } }
      responses:
        '200':
          description: Đã liên kết
          content:
            application/json:
              schema: { type: object, required: [user], properties: { user: { $ref: '#/components/schemas/AppUser' } } }
        '401': { description: 'AUTH_REQUIRED hoặc GOOGLE_TOKEN_INVALID', $ref: '#/components/responses/Error' }
        '409': { description: 'ACCOUNT_EXISTS (Google này đã gắn tài khoản khác)', $ref: '#/components/responses/Error' }
        '503': { description: 'GOOGLE_UNAVAILABLE', $ref: '#/components/responses/Error' }
    delete:
      operationId: unlinkGoogle
      summary: Huỷ liên kết Google (phải còn mật khẩu)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Đã huỷ liên kết
          content:
            application/json:
              schema: { type: object, required: [user], properties: { user: { $ref: '#/components/schemas/AppUser' } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /health/live:
    get:
      operationId: live
      summary: Process còn chạy
      responses:
        '200': { $ref: '#/components/responses/Health' }
  /health/ready:
    get:
      operationId: ready
      summary: Sẵn sàng phục vụ (OTP và database trả lời trong 1 giây)
      responses:
        '200': { $ref: '#/components/responses/Health' }
        '503': { $ref: '#/components/responses/Health' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token của phiên app (ADR-040), server chỉ giữ bản băm SHA-256
  headers:
    RequestId:
      description: Mã request, cũng có trong log và trong body lỗi
      schema: { type: string }
  responses:
    Error:
      description: |
        400 INVALID_REQUEST; 422 NO_ROUTE_FOUND, OUT_OF_COVERAGE, DATA_UNAVAILABLE;
        503 ROUTING_UNAVAILABLE; 504 ROUTING_TIMEOUT. Mọi endpoint còn có thể trả
        404/405 NOT_FOUND (sai đường dẫn hoặc phương thức) và 500 INTERNAL_ERROR (lỗi không lường trước).
        Discover: 404 PLACE_NOT_FOUND; 503 DATA_STORE_UNAVAILABLE (database lỗi hoặc quá 5 giây).
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Health:
      description: Trạng thái
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties:
              status: { type: string, enum: [ok, unavailable] }
  schemas:
    Coordinate:
      type: object
      required: [lat, lon]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lon: { type: number, minimum: -180, maximum: 180 }
    PlanRequest:
      type: object
      additionalProperties: false
      required: [origin, destination]
      properties:
        origin: { $ref: '#/components/schemas/Coordinate' }
        destination: { $ref: '#/components/schemas/Coordinate' }
        dateTime:
          type: string
          format: date-time
          description: RFC 3339, bắt buộc có múi giờ. Bỏ trống = bây giờ.
        timeType:
          type: string
          enum: [DEPART, ARRIVE]
          default: DEPART
          description: DEPART = đi sau dateTime; ARRIVE = đến trước dateTime.
        modes:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [WALK, TRANSIT, BUS, CAR, BICYCLE] }
          default: [WALK, TRANSIT]
          description: >-
            [WALK] = chỉ đi bộ; [TRANSIT] = bắt buộc dùng phương tiện công cộng (Metro, xe buýt); cả hai = để hệ thống chọn.
            [BUS] = chỉ đi xe buýt (đi bộ tới/từ trạm). [CAR] hoặc [BICYCLE] = chỉ đi bằng ô tô / xe đạp. BUS, CAR, BICYCLE phải đứng một mình (RD-0, ADR-032). Thời gian ô tô không tính kẹt xe.
        maxResults: { type: integer, minimum: 1, maximum: 5, default: 3 }
    PlanResponse:
      type: object
      required: [dataStatus, routes]
      properties:
        dataStatus:
          type: string
          enum: [ASSUMED, OFFICIAL]
          description: ASSUMED = dữ liệu giả định, không phải lịch chính thức (ADR-020).
        routes:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Route' }
    Route:
      type: object
      required: [startTime, endTime, durationSec, walkDistanceM, transfers, legs]
      properties:
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time }
        durationSec: { type: integer }
        walkDistanceM: { type: number }
        transfers: { type: integer }
        legs:
          type: array
          items: { $ref: '#/components/schemas/Leg' }
    Leg:
      type: object
      required: [mode, transit, from, to, startTime, endTime, durationSec, distanceM, realtime, polyline]
      properties:
        mode: { type: string, description: 'Ví dụ WALK, SUBWAY, BUS, CAR, BICYCLE' }
        transit: { type: boolean }
        from: { $ref: '#/components/schemas/Place' }
        to: { $ref: '#/components/schemas/Place' }
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time }
        durationSec: { type: integer }
        distanceM: { type: number }
        realtime: { type: boolean, description: 'false = giờ theo lịch' }
        headsign: { type: string }
        line:
          type: object
          required: [id]
          properties:
            id: { type: string }
            shortName: { type: string }
            longName: { type: string }
        polyline: { type: string, description: 'Google encoded polyline, độ chính xác 5' }
        steps:
          type: array
          description: 'Chỉ dẫn từng bước (NAV-1) cho chặng đi bộ/xe đạp/ô tô; không có ở chặng công cộng'
          items:
            type: object
            required: [direction, street, distanceM, lat, lon]
            properties:
              direction: { type: string, description: 'relativeDirection của OTP: DEPART, LEFT, RIGHT, SLIGHTLY_LEFT, HARD_RIGHT, CONTINUE, UTURN_LEFT, CIRCLE_CLOCKWISE, ...' }
              street: { type: string, description: 'Tên đường; OTP dùng "road", "path"… khi đường không có tên' }
              distanceM: { type: number, description: 'Quãng đường từ bước này đến bước sau' }
              lat: { type: number }
              lon: { type: number }
    Place:
      type: object
      required: [name, lat, lon]
      properties:
        name: { type: string }
        lat: { type: number }
        lon: { type: number }
        stopId: { type: string, description: 'Chỉ có khi là ga/trạm' }
    Category:
      type: object
      required: [slug, name, placeCount]
      properties:
        slug: { type: string }
        name: { type: string }
        nameEn: { type: string }
        placeCount: { type: integer }
    CategoryRef:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string }
        name: { type: string }
        nameEn: { type: string }
    Source:
      type: object
      required: [kind, license, attribution]
      description: Nguồn và giấy phép, phải hiển thị cho người dùng (ADR-028)
      properties:
        kind: { type: string, enum: [OSM, CURATED] }
        url: { type: string }
        license: { type: string }
        attribution: { type: string }
    PlaceSummary:
      type: object
      required: [id, name, slug, lat, lon, source]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        nameEn: { type: string }
        slug: { type: string }
        shortDescription: { type: string }
        lat: { type: number }
        lon: { type: number }
        address: { type: string }
        category: { $ref: '#/components/schemas/CategoryRef' }
        distanceM: { type: number, description: 'Chỉ có ở /places/nearby' }
        source: { $ref: '#/components/schemas/Source' }
    PlaceDetail:
      allOf:
        - { $ref: '#/components/schemas/PlaceSummary' }
        - type: object
          required: [categories, media, foods]
          properties:
            categories:
              type: array
              items: { $ref: '#/components/schemas/CategoryRef' }
            media:
              type: array
              items:
                type: object
                required: [storageKey, mediaType, sourceCredit, license, isCover]
                properties:
                  storageKey: { type: string }
                  mediaType: { type: string }
                  altText: { type: string }
                  sourceCredit: { type: string }
                  license: { type: string }
                  isCover: { type: boolean }
            foods:
              type: array
              items:
                type: object
                required: [name, slug, currency]
                properties:
                  name: { type: string }
                  nameEn: { type: string }
                  slug: { type: string }
                  priceMin: { type: number }
                  priceMax: { type: number }
                  currency: { type: string }
    AppSession:
      type: object
      required: [token, expiresAt]
      properties:
        token: { type: string, description: 'Cất trong Keychain (iOS) / Keystore (Android), không ghi log' }
        expiresAt: { type: string, format: date-time, description: '60 ngày, tự gia hạn khi dùng' }
    AppUser:
      type: object
      required: [id, name, emailVerified, phoneVerified, hasPassword, google]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        username: { type: string, nullable: true }
        email: { type: string, format: email, nullable: true }
        emailVerified: { type: boolean }
        phone: { type: string, nullable: true, description: E.164 }
        phoneVerified: { type: boolean, description: 'false cho tới khi có SMS (AUTH-5)' }
        hasPassword: { type: boolean }
        google: { type: boolean, description: 'đã liên kết Google' }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
              enum: [INVALID_REQUEST, NO_ROUTE_FOUND, OUT_OF_COVERAGE, DATA_UNAVAILABLE, ROUTING_TIMEOUT, ROUTING_UNAVAILABLE, NOT_FOUND, INTERNAL_ERROR, PLACE_NOT_FOUND, DATA_STORE_UNAVAILABLE, GEOCODER_UNAVAILABLE]
            message: { type: string, description: 'Tiếng Việt, hiển thị được cho người dùng' }
            requestId: { type: string }
